<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-40" data-alt="A lush, detailed close-up of vibrant green monstera leaves and other tropical indoor plants bathed in soft, diffused morning sunlight. The lighting is high-key and bright, creating a clean, modern aesthetic. The plants look incredibly healthy and tactile, embodying a 'Digital Conservatory' vibe. The overall mood is calm, organic, and revitalizing, perfect for a botanical tech app." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAnEjnzt2HUU0oGJ9r_1wRGDCFJRjdvkMJbeTZ7ES3rKDeJ2uABaRixo45lPzGDsMjsW9c7kaisItZXUryKA8_bd2aYZNYYu9ldjwcpNqVnkw24xur4-UtRuAuKaszBtUOOeKTVzP7Za3Dd0-ccjKKc8TgOgte-84GiQ9q45bQV9rHwHPTEPBIiS97r75YmsTceyTa6Ylt4e9zM3pWlJnY_g5Y7VjJadiWa3bGYIoWlh8NMJ52NmEhe')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-surface/90 to-surface z-10"></div>
</div>
<!-- Main Content Canvas (Transactional - No Navigation Shells) -->
<main class="flex-grow flex flex-col justify-center items-center px-container-margin-mobile z-20 relative pt-12 pb-8 w-full max-w-md mx-auto h-screen">
<!-- Logo & Header -->
<div class="text-center mb-10 w-full">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary-container mb-6 shadow-sm">
<span class="material-symbols-outlined text-4xl" data-icon="potted_plant">potted_plant</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 tracking-tight">GrowHub</h1>
<p class="font-headline-md-mobile text-headline-md-mobile text-on-surface-variant font-medium">Chào mừng bạn trở lại</p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-lowest rounded-[16px] p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/20 backdrop-blur-sm relative">
<form class="space-y-5">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
</span>
<input class="w-full bg-surface-container-low border border-transparent text-on-surface text-body-lg rounded-lg focus:ring-1 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest block pl-10 p-3 transition-colors duration-200" id="email" name="email" placeholder="nguoidung@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="password">Mật khẩu</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</span>
<input class="w-full bg-surface-container-low border border-transparent text-on-surface text-body-lg rounded-lg focus:ring-1 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest block pl-10 p-3 transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Ghi nhớ tôi
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-semibold text-primary hover:text-surface-tint transition-colors" href="#">
                            Quên mật khẩu?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm font-headline-md-mobile text-headline-md-mobile text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                        Đăng nhập
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-3 bg-surface-container-lowest font-body-sm text-body-sm text-outline">Hoặc tiếp tục với</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-3">
<button class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-outline-variant/40 rounded-lg shadow-sm bg-surface-container-lowest font-body-sm text-body-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="account_circle">account_circle</span>
                    Google
                </button>
<button class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-outline-variant/40 rounded-lg shadow-sm bg-surface-container-lowest font-body-sm text-body-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="apple">file_download</span>
                    Apple
                </button>
</div>
</div>
<!-- Sign Up Link -->
<p class="mt-8 text-center font-body-sm text-body-sm text-on-surface-variant">
            Chưa có tài khoản? 
            <a class="font-semibold text-primary hover:text-surface-tint transition-colors" href="#">Đăng ký ngay</a>
</p>
</main>
</body></html>
