<p class="font-body-lg text-body-lg text-on-primary/90">Monitor your indoor ecosystem with precision sensors and data-driven insights.</p>
</div>
</section>

<div class="flex items-center justify-center gap-2 mb-sm text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="potted_plant" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
<h1 class="font-headline-md text-headline-md">GrowHub</h1>
</div>

<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your digital conservatory.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-sm" method="POST">
<!-- Email -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-low border border-outline-variant rounded-lg focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:border-primary font-body-sm text-body-sm text-on-surface placeholder-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-low border border-outline-variant rounded-lg focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary focus:border-primary font-body-sm text-body-sm text-on-surface placeholder-on-surface-variant/50 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<div class="flex items-center justify-between py-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-low" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-body-sm">
<a class="font-body-sm text-primary hover:text-primary-container font-semibold transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-body-lg font-body-lg text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors active:scale-[0.98]" type="submit">

<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm">Or continue with</span>
</div>
