<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrowHub - Live Camera View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "inverse-on-surface": "#f1f1f1",
                    "primary-container": "#2e7d32",
                    "on-error": "#ffffff",
                    "on-surface": "#1a1c1c",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f3f3f3",
                    "inverse-primary": "#88d982",
                    "secondary-container": "#abf4ac",
                    "on-tertiary-fixed-variant": "#663d00",
                    "tertiary": "#7a4a00",
                    "primary-fixed": "#a3f69c",
                    "on-surface-variant": "#40493d",
                    "tertiary-container": "#9c6000",
                    "outline": "#707a6c",
                    "tertiary-fixed": "#ffddba",
                    "on-secondary-container": "#2e7238",
                    "on-secondary-fixed-variant": "#07521d",
                    "secondary-fixed-dim": "#90d792",
                    "outline-variant": "#bfcaba",
                    "error": "#ba1a1a",
                    "surface-dim": "#dadada",

                    "primary": "#0d631b",
                    "on-secondary-fixed": "#002107",
                    "surface-tint": "#1b6d24",
                    "primary-fixed-dim": "#88d982",
                    "on-background": "#1a1c1c",
                    "on-primary": "#ffffff",

                    "secondary-fixed": "#abf4ac",
                    "on-primary-container": "#cbffc2",
                    "on-tertiary": "#ffffff",
                    "surface-container-lowest": "#ffffff",

            "borderRadius": {

                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "lg": "32px",
                    "base": "4px",
                    "container-margin-desktop": "40px",
                    "gutter": "16px",
                    "xs": "8px",
                    "sm": "16px",
                    "xl": "48px",
                    "md": "24px",
                    "container-margin-mobile": "16px"
            },
            "fontFamily": {
                    "stat-value": [
                            "Inter"
                    ],
                    "body-lg": [

                    "body-sm": [

                    "headline-md-mobile": [

                    ],
                    "label-caps": [

                    ],
                    "display-lg": [

                    "headline-md": [

                    ]

            "fontSize": {
                    "stat-value": [

                                    "fontWeight": "700"

                    ],
                    "body-lg": [
                            "16px",

                                    "fontWeight": "400"
                            }
                    ],
                    "body-sm": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-md-mobile": [
                            "20px",

                                    "lineHeight": "28px",
                                    "fontWeight": "600"

                    ],
                    "label-caps": [
                            "12px",

                                    "lineHeight": "16px",

                    ],
                    "display-lg": [

                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",

                    ],
                    "headline-md": [
                            "24px",

                                    "lineHeight": "32px",
                                    "letterSpacing": "-0.01em",

                    ]
            }

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .bg-glass-dark {
            background: rgba(26, 28, 28, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Placeholder (Since TopAppBar was missing in user prompt, creating a minimal structural equivalent based on rules) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-container-margin-mobile h-16 z-40">
<button class="text-on-surface-variant hover:bg-surface-container-high active:scale-95 duration-150 ease-in-out p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary dark:text-primary-fixed">Live Camera</h1>
<button class="text-on-surface-variant hover:bg-surface-container-high active:scale-95 duration-150 ease-in-out p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto pb-24 relative flex flex-col">
<!-- Live Video Feed Container -->
<div class="relative w-full h-[60vh] bg-surface-variant shrink-0">
<!-- Video Placeholder Image -->
<img alt="Live Camera Feed" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLvOBPIuaIQ4kkGTHPVkOU5qmvm7S2sK1MSUlJj4ANG2dPSgVE2FaTQsmS2n56xeLW6Tqh6oV8ozUZD82Shnh8XRLxQnZY0AxH71XZxpjIYzyx3fgdkolPbXvvMiKHT579Zo7vFfLqcZAcSDWb6Jepisj7s86bP-8uXkjuJ_4iWbFUNJPgiMX_Lm0tL3j4qLYrU1rTW7MMQmIcFDAEhXf2OXpY8O3QT8y49wpl0d10FFxMy11kOPD4cLQg"/>
<!-- Live Indicator Badge -->
<div class="absolute top-gutter left-gutter bg-error/90 text-on-error px-3 py-1 rounded-full flex items-center gap-2 shadow-sm z-10 backdrop-blur-sm">
<div class="w-2 h-2 rounded-full bg-on-error animate-pulse"></div>
<span class="font-label-caps text-label-caps tracking-widest uppercase">LIVE</span>
</div>
<div class="absolute top-gutter right-gutter bg-glass-dark text-on-primary px-3 py-1 rounded-full flex items-center gap-2 shadow-sm z-10">
<span class="font-label-caps text-label-caps uppercase opacity-80">Zone 1</span>
</div>
<!-- Overlaid Stats (Glassmorphism Bento Style) -->
<div class="absolute bottom-gutter left-gutter right-gutter grid grid-cols-3 gap-xs z-20">
<!-- Stat: Temp -->
<div class="bg-glass-dark rounded-lg p-3 flex flex-col items-center justify-center border border-white/10 shadow-lg">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-[20px] mb-1" data-icon="device_thermostat">device_thermostat</span>
<span class="font-stat-value text-body-lg font-bold text-on-primary">22.4°C</span>
<span class="font-label-caps text-[10px] text-outline-variant mt-1">TEMP</span>
</div>
<!-- Stat: Humidity -->
<div class="bg-glass-dark rounded-lg p-3 flex flex-col items-center justify-center border border-white/10 shadow-lg">
<span class="material-symbols-outlined text-inverse-primary text-[20px] mb-1" data-icon="water_drop">water_drop</span>
<span class="font-stat-value text-body-lg font-bold text-on-primary">64%</span>
<span class="font-label-caps text-[10px] text-outline-variant mt-1">HUMID</span>
</div>
<!-- Stat: Light -->
<div class="bg-glass-dark rounded-lg p-3 flex flex-col items-center justify-center border border-white/10 shadow-lg">
<span class="material-symbols-outlined text-tertiary-fixed text-[20px] mb-1" data-icon="light_mode">light_mode</span>
<span class="font-stat-value text-body-lg font-bold text-on-primary">850</span>
<span class="font-label-caps text-[10px] text-outline-variant mt-1">PPFD</span>
</div>
</div>
<!-- Subtle gradient overlay to make stats readable -->
<div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
</div>
<!-- Camera Controls -->
<div class="px-container-margin-mobile py-sm flex flex-col gap-sm flex-1 bg-surface-bright z-30 -mt-4 rounded-t-[24px] shadow-[0px_-8px_24px_rgba(0,0,0,0.08)] relative">
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-2"></div>
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-2">Camera Controls</h2>
<div class="flex justify-between items-center gap-gutter mb-sm">
<!-- Action Buttons -->
<div class="flex gap-xs w-full">
<button class="flex-1 bg-primary text-on-primary rounded-xl py-3 px-4 flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform shadow-[0px_4px_12px_rgba(13,99,27,0.2)]">
<span class="material-symbols-outlined" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-caps text-[11px]">Capture</span>
</button>
<button class="flex-1 border-2 border-primary text-primary bg-surface rounded-xl py-3 px-4 flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="videocam">videocam</span>
<span class="font-label-caps text-[11px]">Record</span>
</button>
</div>
</div>
<!-- Settings Toggles -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between border border-outline-variant/20 shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="nightlight">nightlight</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">Night Vision</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs">Auto-detect low light</p>
</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between border border-outline-variant/20 shadow-sm opacity-60">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="timelapse">timelapse</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">Timelapse Mode</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs">Inactive</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-not-allowed">
<input class="sr-only peer" disabled="" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant rounded-full peer after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5"></div>
</label>
</div>
</div>
</main>
<!-- BottomNavBar (Shared Component JSON injected) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container dark:bg-surface-container-low shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] border-t-0 md:hidden">
<div class="flex justify-around items-center w-full px-2 py-3 bg-surface-container dark:bg-surface-container-low">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-caps text-label-caps">Dashboard</span>
</button>
<!-- Making 'Dashboard' active conceptually, though for a camera view it might sit under Dashboard. We will highlight Dashboard. -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" data-icon="eco" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-label-caps text-label-caps">My Plants</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-label-caps text-label-caps">Schedule</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</button>
</div>
</nav>
</body></html>
